<!doctype html>
<html lang="kaa" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17120e"><title>QARAQALPAQ ASXANASI — Basqarıw</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script><script src="js/config.js"></script>
<style>
:root{--bg:#17120e;--panel:#211b15;--panel2:#30271e;--gold:#d4af37;--cream:#faf7f2;--muted:#a89f91;--line:#4b3c24;--red:#ff9d91}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font:14px 'Plus Jakarta Sans',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1100px;margin:auto;padding:28px 20px}.brand{font:600 27px 'Playfair Display';color:var(--gold)}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px;margin:12px 0}.field{width:100%;background:#17120e;color:var(--cream);border:1px solid var(--line);border-radius:10px;padding:11px;outline:none}.field:focus{border-color:var(--gold)}.btn{border:0;background:var(--gold);color:#21190b;border-radius:99px;padding:10px 16px;font-weight:800}.btn:disabled{opacity:.5}.btn.secondary{background:var(--panel2);border:1px solid var(--line);color:var(--cream)}.btn.danger{background:#4c211c;color:#ffd8d2}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button{background:var(--panel2);color:var(--cream);border:1px solid var(--line);border-radius:99px;padding:10px 16px}.tabs button.active{background:var(--gold);color:#21190b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.grow{flex:1;min-width:0}.small{font-size:12px}.error{color:var(--red)}.ok{color:#a7d8a0}.order-title{display:flex;justify-content:space-between;gap:12px}.pill{color:var(--gold);font-size:12px}.item{display:flex;gap:12px;align-items:center}.item img{width:62px;height:62px;object-fit:cover;border-radius:10px}.item input{min-width:0}.hidden{display:none!important}.login{max-width:390px;margin:12vh auto}.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.qr{background:white;color:#17120e;text-align:center;padding:12px;border-radius:12px}.qr img{width:100%}label{font-size:12px;color:var(--muted)}h2{font:500 24px 'Playfair Display'}@media(max-width:650px){.wrap{padding:18px 13px}.grid{grid-template-columns:1fr}.order-title{display:block}}
</style></head><body><main class="wrap"><div id="app"><p class="muted">Júklenbekte...</p></div></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('ru-RU')+" so'm";
const cfg=window.CFG||{},configured=cfg.SUPABASE_URL&&cfg.SUPABASE_ANON_KEY&&!/SIZIŃ|YOUR_|CHANGE_ME|placeholder/i.test(cfg.SUPABASE_URL+cfg.SUPABASE_ANON_KEY);
if(!configured||!window.supabase){$('app').innerHTML='<div class="panel"><h1 class="brand">QARAQALPAQ ASXANASI — Admin</h1><p class="error">Supabase konfiguraciyası tabılmadı. js/config.js faylın toltırıń.</p></div>';return;}
const sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
let tab='orders',channel=null,muted=localStorage.getItem('qaraqalpagim-mute')==='1',categories=[],menuItems=[];
const states={new:'Jańa',accepted:'Qabıllandı',preparing:'Tayarlanbaqta',ready:'Tayar',completed:'Juwmaqlandı',cancelled:'Bekar etildi'};
const types={dinein:'Stolda',delivery:'Jetkizip beriw',pickup:'Alıp ketiw'};
function btn(text,action,cls=''){return `<button class="btn ${cls}" data-action="${action}">${text}</button>`;}
function message(text,error=false){const n=$('notice');if(n){n.textContent=text;n.className=error?'error small':'ok small';}}
function login(){ $('app').innerHTML=`<div class="panel login"><h1 class="brand">QARAQALPAQ ASXANASI</h1><p class="muted">Basqarıw paneline kiriw</p><form id="login-form"><label>Email</label><input class="field" id="email" type="email" autocomplete="username" required><label>Parol</label><input class="field" id="password" type="password" autocomplete="current-password" required><p id="login-error" class="error small"></p><button class="btn" style="width:100%">Kiriw</button></form></div>`;
 $('login-form').addEventListener('submit',async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)$('login-error').textContent='Email yamasa parol qáte.';else boot();});}
async function boot(){
 const {data:{session}}=await sb.auth.getSession();if(!session){login();return;}
 const {data:admin,error}=await sb.from('admins').select('user_id').eq('user_id',session.user.id).maybeSingle();
 if(error||!admin){$('app').innerHTML=`<div class="panel"><h2>Admin ruxsatı joq</h2><p class="muted">Bul akkaunt basqarıwshılar diziminde joq.</p>${btn('Shıǵıw','logout')}</div>`;return;}
 shell();await show();if(!channel)channel=sb.channel('admin-orders').on('postgres_changes',{event:'INSERT',schema:'public',table:'orders'},()=>{if(!muted)beep();if(tab==='orders')orders();}).subscribe();
 sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT')login();});
}
function shell(){$('app').innerHTML=`<div class="row"><div class="grow"><div class="brand">QARAQALPAQ ASXANASI</div><div class="muted small">Asxana basqarıw paneli</div></div><button class="btn secondary" id="mute">${muted?'🔇':'🔔'}</button>${btn('Shıǵıw','logout','secondary')}</div><nav class="tabs">${[['orders','Buyırtpalar'],['menu','Menyu'],['tables','Stollar']].map(([k,v])=>`<button data-tab="${k}">${v}</button>`).join('')}</nav><p id="notice"></p><section id="content"></section>`;
 document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;show();}));
 $('mute').addEventListener('click',()=>{muted=!muted;localStorage.setItem('qaraqalpagim-mute',muted?'1':'0');$('mute').textContent=muted?'🔇':'🔔';});
 $('app').addEventListener('click',handleAction);}
async function show(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='orders')await orders();if(tab==='menu')await menu();if(tab==='tables')await tables();}
function beep(){try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.35);setTimeout(()=>a.close(),500);}catch{}}
async function orders(){
 $('content').innerHTML='<p class="muted">Buyırtpalar júklenbekte...</p>';
 const{data,error}=await sb.from('orders').select('*,restaurant_tables(number),order_items(*)').order('id',{ascending:false}).limit(100);
 if(error){$('content').innerHTML='<p class="error">Buyırtpalar júklenbedi. RLS hám Supabase baylanısın tekseriń.</p>';return;}
 const list=data||[],newCount=list.filter(o=>o.status==='new').length;
 $('content').innerHTML=`<div class="panel"><b>Jańa buyırtpalar: <span class="pill">${newCount}</span></b><p class="muted small">Sońǵı 100 buyırtpa kórsetilgen.</p></div>`+(list.length?list.map(o=>`<article class="panel"><div class="order-title"><b>#${o.id} · ${types[o.type]||esc(o.type)}${o.restaurant_tables?.number?' · Stol № '+o.restaurant_tables.number:''}</b><span class="pill">${states[o.status]||esc(o.status)}</span></div><p class="small">${o.customer_name?esc(o.customer_name)+' · '+esc(o.phone):'QR stol buyırtpası'}</p>${o.address?`<p class="small">${esc(o.address)}</p>`:''}${o.note?`<p class="small muted">${esc(o.note)}</p>`:''}<ul class="small">${(o.order_items||[]).map(i=>`<li>${i.qty} × ${esc(i.name)}${i.note?' — '+esc(i.note):''} (${fmt(i.price*i.qty)})</li>`).join('')}</ul><b class="pill">${fmt(o.total)}</b><div class="row" style="margin-top:12px"><select class="field grow" data-status="${o.id}">${Object.entries(states).map(([k,v])=>`<option value="${k}" ${k===o.status?'selected':''}>${v}</option>`).join('')}</select>${btn('Jańalaw','refresh-orders','secondary')}</div></article>`).join(''):'<p class="muted">Házirshe buyırtpa joq.</p>');
 document.querySelectorAll('[data-status]').forEach(s=>s.addEventListener('change',async()=>{const{error}=await sb.from('orders').update({status:s.value}).eq('id',s.dataset.status);if(error)message('Status ózgertilmedi: '+error.message,true);else{message('Buyırtpa statusı jańalandı.');orders();}}));
}
async function menu(){
 $('content').innerHTML='<p class="muted">Menyu júklenbekte...</p>';
 const[c,m]=await Promise.all([sb.from('categories').select('*').order('sort'),sb.from('menu_items').select('*').order('id')]);
 if(c.error||m.error){$('content').innerHTML='<p class="error">Menyu júklenbedi.</p>';return;}
 categories=c.data||[];menuItems=m.data||[];
 $('content').innerHTML=`<div class="panel"><h2>Bólim qosıw</h2><div class="row"><input id="new-category" class="field grow" maxlength="80" placeholder="Bólim atı"><button class="btn" data-action="add-category">Qosıw</button></div><div class="row" style="margin-top:12px">${categories.map(c=>`<span class="pill">${esc(c.name)} <button class="remove-btn" title="Atın ózgertiw" data-rename-category="${c.id}">✎</button><button class="remove-btn" title="Óshiriw" data-delete-category="${c.id}">✕</button></span>`).join('')}</div></div>
 <div class="panel"><h2>Jańa awqat qosıw</h2><div class="grid"><input id="new-name" class="field" placeholder="Awqat atı" maxlength="120"><input id="new-price" class="field" type="number" min="0" step="1000" placeholder="Bahası (som)"><select id="new-category-id" class="field">${categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><input id="new-description" class="field" placeholder="Qısqasha sıpatlama"><input id="new-image" class="field" type="file" accept="image/*"></div><p style="margin-top:12px">${btn('Menyuge qosıw','add-item')}</p></div>
 <h2>Menyudegi awqatlar (${menuItems.length})</h2>`+menuItems.map(x=>`<article class="panel item">${x.image_url?`<img src="${esc(x.image_url)}" alt="">`:''}<div class="grow"><input class="field" data-edit-name="${x.id}" value="${esc(x.name)}" aria-label="Awqat atı"><div class="row" style="margin-top:6px"><input class="field grow" data-edit-desc="${x.id}" value="${esc(x.description)}" aria-label="Sıpatlama"><input class="field" style="width:130px" type="number" min="0" data-edit-price="${x.id}" value="${x.price}" aria-label="Bahası"></div><div class="row" style="margin-top:6px"><label><input type="checkbox" data-edit-available="${x.id}" ${x.available?'checked':''}> Menyude bar</label><select class="field grow" data-edit-cat="${x.id}">${categories.map(c=>`<option value="${c.id}" ${Number(x.category_id)===Number(c.id)?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div><div class="row">${btn('Saqlaw','save-item','secondary')}${btn('Óshiriw','delete-item','danger')}</div></article>`).join('');
 document.querySelectorAll('[data-delete-category]').forEach(b=>b.addEventListener('click',()=>deleteCategory(b.dataset.deleteCategory)));
 document.querySelectorAll('[data-rename-category]').forEach(b=>b.addEventListener('click',()=>renameCategory(b.dataset.renameCategory)));
}
async function uploadImage(file){if(!file)return null;if(file.size>5*1024*1024)throw Error('Súwret 5 MB dan kishi bolıwı kerek.');if(!file.type.startsWith('image/'))throw Error('Tek súwret faylın tańlań.');const safe=file.name.toLowerCase().replace(/[^a-z0-9._-]/g,'-'),path=crypto.randomUUID()+'-'+safe;const{error}=await sb.storage.from('food').upload(path,file,{upsert:false});if(error)throw error;return sb.storage.from('food').getPublicUrl(path).data.publicUrl;}
async function addCategory(){const name=$('new-category').value.trim();if(!name)return message('Bólim atın kiritiń.',true);const{error}=await sb.from('categories').insert({name,sort:categories.length+1});if(error)return message(error.message,true);message('Bólim qosıldı.');menu();}
async function renameCategory(id){const current=categories.find(c=>String(c.id)===String(id));const name=prompt('Jańa bólim atı:',current?.name||'');if(name===null||!name.trim())return;const{error}=await sb.from('categories').update({name:name.trim()}).eq('id',id);if(error)message(error.message,true);else{message('Bólim atı jańalandı.');menu();}}
async function deleteCategory(id){if(!confirm('Bólimdi óshiriw? Awqatlar kategoriyasız qaladı.'))return;const{error}=await sb.from('categories').delete().eq('id',id);if(error)message(error.message,true);else{message('Bólim óshirildi.');menu();}}
async function addItem(){const name=$('new-name').value.trim(),price=Number($('new-price').value);if(name.length<1||!Number.isInteger(price)||price<0)return message('Awqat atı hám durıs baha kiritiń.',true);try{const image_url=await uploadImage($('new-image').files[0]);const{error}=await sb.from('menu_items').insert({name,price,description:$('new-description').value.trim(),category_id:Number($('new-category-id').value)||null,image_url});if(error)throw error;message('Awqat menyuge qosıldı.');menu();}catch(e){message('Awqat qosılmadı: '+e.message,true);}}
async function saveItem(id){const patch={name:document.querySelector(`[data-edit-name="${id}"]`).value.trim(),description:document.querySelector(`[data-edit-desc="${id}"]`).value.trim(),price:Number(document.querySelector(`[data-edit-price="${id}"]`).value),available:document.querySelector(`[data-edit-available="${id}"]`).checked,category_id:Number(document.querySelector(`[data-edit-cat="${id}"]`).value)||null};if(!patch.name||!Number.isInteger(patch.price)||patch.price<0)return message('Awqat atı yamasa bahası qáte.',true);const{error}=await sb.from('menu_items').update(patch).eq('id',id);if(error)message(error.message,true);else{message('Awqat maǵlıwmatı saqlandı.');menu();}}
async function deleteItem(id){if(!confirm('Awqattı óshiriwdi tastıyıqlaysızba?'))return;const{error}=await sb.from('menu_items').delete().eq('id',id);if(error)message(error.message,true);else{message('Awqat óshirildi.');menu();}}
async function tables(){const{data,error}=await sb.from('restaurant_tables').select('*').order('number');if(error){$('content').innerHTML='<p class="error">Stollar júklenbedi.</p>';return;}const list=data||[];const qrs=await Promise.all(list.map(t=>QRCode.toDataURL(new URL('index.html?t='+encodeURIComponent(t.token),location.href).href,{width:500,margin:2})));
 $('content').innerHTML=`<div class="panel"><h2>Stol qosıw</h2><div class="row"><input id="table-number" class="field grow" type="number" min="1" placeholder="Stol nomeri">${btn('Stol qosıw','add-table')}${btn('Basıp shıǵarıw','print','secondary')}</div></div><div class="qrgrid">${list.map((t,i)=>`<div class="qr"><b>Stol № ${t.number}</b><img src="${qrs[i]}" alt="Stol ${t.number} QR kodı"><small>${t.active?'Aktiv':'Aktiv emes'}</small><div class="row" style="justify-content:center;margin-top:8px"><a class="btn" download="stol-${t.number}.png" href="${qrs[i]}">PNG</a>${btn(t.active?'Jabıq etiw':'Aktivlestiriw','toggle-table','secondary')}<input type="hidden" data-table-id="${t.id}" data-table-active="${!t.active}"></div></div>`).join('')}</div>`;
}
async function addTable(){const number=Number($('table-number').value);if(!Number.isInteger(number)||number<1)return message('Stol nomerin durıs kiritiń.',true);const{error}=await sb.from('restaurant_tables').insert({number});if(error)message(error.message,true);else{message('Stol qosıldı.');tables();}}
async function toggleTable(id,active){const{error}=await sb.from('restaurant_tables').update({active}).eq('id',id);if(error)message(error.message,true);else tables();}
async function handleAction(e){const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='logout'){await sb.auth.signOut();login();}if(a==='add-category')addCategory();if(a==='add-item')addItem();if(a==='refresh-orders')orders();if(a==='print')window.print();if(a==='save-item'){const card=b.closest('.panel');const id=card.querySelector('[data-edit-name]').dataset.editName;saveItem(id);}if(a==='delete-item'){const id=b.closest('.panel').querySelector('[data-edit-name]').dataset.editName;deleteItem(id);}if(a==='add-table')addTable();if(a==='toggle-table'){const card=b.closest('.qr');const input=card.querySelector('[data-table-id]');toggleTable(input.dataset.tableId,input.dataset.tableActive==='true');}}
async function start(){const{data:{session}}=await sb.auth.getSession();if(session)await boot();else login();}
start().catch(e=>{console.error(e);$('app').innerHTML='<p class="error">Admin paneli júklenbedi. Betti jańalań.</p>';});
})();
</script></body></html>
